<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenon, Danielle 6IMODSIM Activity 2</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: black;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .clock-container {
      position: relative;
      width: 450px;
      height: 450px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .clock-container::before, .clock-container::after {
      content: ""; position: absolute; border-radius: inherit; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;}

    .clock-container::before {
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.15), transparent 70%); mix-blend-mode: overlay;}

    .clock-container::after {
      background: rgba(255, 255, 255, 0.04); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);}

    .clock {width: 100%;height: 100%; position: relative;}

    .hour-marks {position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1;}

    .hour-mark, .minute-mark {
      position: absolute; left: 50%; top: 50%; transform-origin: center; background-color: white; border-radius: 9px;}

    .hour-mark {width: 3.25px; height: 18px; margin-left: -1.5px; margin-top: -9px;}

    .minute-mark {width: 2.25px; height: 9px; margin-left: -0.75px; margin-top: -4.342px; opacity: 0.5;}

    .hour-number {
      position: absolute;
      width: 36px;
      height: 36px;
      font-size: 24.5px;
      font-weight: 400;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .hand {
      position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 9px; background-color: white;}

    .hour-hand {width: 7.5625px; height: 113.85px; margin-left: -3.75px; z-index: 2; border-radius: 9px;}

    .minute-hand {width: 7.5625px; height: 207px; margin-left: -3.75px; z-index: 2; border-radius: 9px;}

    .second-hand {
      width: 2.75px;
      height: 207px;
      background-color: red;
      margin-left: -1.5px;
      z-index: 5;
      position: absolute;
      left: 50.07%;
      bottom: 49.9%;
      transform-origin: 50% 100%;
      border-radius: 9px;
    }

    .second-hand::after {
      content: '';
      position: absolute;
      width: 2.75px;
      height: 15px;
      background-color: red;
      top: 100%;
      left: 0;
      border-radius: 9px;
      margin-top: -2.22px;
    }

    .center-circle {
      position: absolute;
      width: 13px;
      height: 13px;
      background-color: white;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      margin-left: -6.4px;
      margin-top: -6px;
      z-index: 4;
    }

    .center-circle::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background-color: black;
      border-radius: 50%;
      z-index: 4;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .day-display {
      position: absolute;
      width: 23px;
      height: 24px;
      left: calc(50% + 125px);
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 14.7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      text-align: right;
      z-index: 1;
      box-shadow: 0 0 4px rgba(0,0,0,0.25);
      background-color: transparent;
      border: 1.25px solid white;
      line-height: 1.1;
      padding-right: 6px;
    }

    .style-text {
      position: absolute;
      top: 61%;
      left: 50%;
      transform: translate(-50%, 170%);
      font-size: 14.7px;
      color: white;
      font-weight: 500;
      z-index: 1;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="clock">
      <div class="hour-marks" id="hourMarks"></div>
      <div id="hourNumbers"></div>
      <div class="hand hour-hand" id="hourHand"></div>
      <div class="hand minute-hand" id="minuteHand"></div>
      <div class="hand second-hand" id="secondHand"></div>
      <div class="center-circle"></div>
      <div class="style-text">STYLE-7</div>
      <div class="day-display" id="dayDisplay"></div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const hourHand = document.getElementById('hourHand');
      const minuteHand = document.getElementById('minuteHand');
      const secondHand = document.getElementById('secondHand');
      const hourMarks = document.getElementById('hourMarks');
      const hourNumbers = document.getElementById('hourNumbers');

      for (let i = 0; i < 12; i++) {
        const mark = document.createElement('div');
        mark.className = 'hour-mark';
        mark.style.transform = `rotate(${i * 30}deg) translateY(-210px)`;
        hourMarks.appendChild(mark);
      }

      for (let i = 0; i < 60; i++) {
        if (i % 5 !== 0) {
          const mark = document.createElement('div');
          mark.className = 'minute-mark';
          mark.style.transform = `rotate(${i * 6}deg) translateY(-210px)`;
          hourMarks.appendChild(mark);
        }
      }

      for (let i = 1; i <= 12; i++) {
        const number = document.createElement('div');
        number.className = 'hour-number';
        number.textContent = i;
        const angle = i * 30;
        const radius = 172.5;
        const radians = (angle - 90) * (Math.PI / 180);
        const x = 225 + radius * Math.cos(radians);
        const y = 225 + radius * Math.sin(radians);
        number.style.left = `${x}px`;
        number.style.top = `${y}px`;
        hourNumbers.appendChild(number);
      }

      function updateClock() {
        const now = new Date();
        const hours = now.getHours() % 12;
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const milliseconds = now.getMilliseconds();
        const hourAngle = (hours * 30) + (minutes * 0.5);
        const minuteAngle = (minutes * 6) + (seconds * 0.1);
        const secondAngle = (seconds * 6) + (milliseconds * 0.006);
        hourHand.style.transform = `rotate(${hourAngle}deg)`;
        minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
        secondHand.style.transform = `rotate(${secondAngle}deg)`;
        requestAnimationFrame(updateClock);
      }

      const dayDisplay = document.getElementById('dayDisplay');
      const day = new Date().getDate();
      dayDisplay.textContent = day;
      updateClock();
    });
  </script>
</body>
</html>
